name: Import OSS Document Scanner upstream

on:
  push:
    paths:
      - '.github/workflows/import-oss-upstream.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GE360 target
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import complete OSS Document Scanner source
        env:
          UPSTREAM_URL: https://github.com/ossappscollective/OSS-DocumentScanner.git
        run: |
          set -euo pipefail

          git clone --depth 1 --recurse-submodules --shallow-submodules "$UPSTREAM_URL" /tmp/oss-document-scanner

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name 'import-oss-upstream.yml' -exec rm -rf {} +

          rsync -a \
            --exclude='.git' \
            --exclude='.git/***' \
            --exclude='.github/workflows/***' \
            /tmp/oss-document-scanner/ ./

          mkdir -p upstream-workflows-disabled
          if [ -d /tmp/oss-document-scanner/.github/workflows ]; then
            cp -a /tmp/oss-document-scanner/.github/workflows/. upstream-workflows-disabled/
            find upstream-workflows-disabled -type f -print0 | while IFS= read -r -d '' f; do
              mv "$f" "$f.disabled"
            done
          fi

          UPSTREAM_SHA="$(git -C /tmp/oss-document-scanner rev-parse HEAD)"
          {
            echo "# GE360 Documenti Personali - upstream"
            echo
            echo "Source: https://github.com/ossappscollective/OSS-DocumentScanner"
            echo "Imported commit: $UPSTREAM_SHA"
            echo
            echo "OSS Document Scanner source is retained under its original MIT license."
            echo "Upstream GitHub Actions workflows are preserved under upstream-workflows-disabled/"
            echo "with a .disabled suffix so they cannot execute in this repository."
          } > GE360_UPSTREAM.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import OSS Document Scanner source at $UPSTREAM_SHA"
          git push origin HEAD:main
